<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>minimal-editor</title>
<style>
:root{color-scheme:dark;background:#202020;color:#dfdfdf;font-family:'Intel One Mono','BIZ UDGothic',monospace}
body{margin:0}
.editor-shell{position:relative;width:min(100%,1100px);margin:auto}
textarea{scrollbar-width:none}
textarea::-webkit-scrollbar{display:none}
#scroll-thumb{position:absolute;right:4px;top:4px;width:20px;border:0;border-radius:2px;margin:0;padding:0;background:#777;visibility:hidden;touch-action:none;cursor:grab}
#scroll-thumb.visible{visibility:visible}
#scroll-thumb:hover{background:#999}
#scroll-thumb:active{background:#aaa;cursor:grabbing}
textarea{display:block;box-sizing:border-box;width:min(100%,1100px);height:100dvh;margin:auto;padding:60px 48px 48px;border:0;outline:0;resize:none;background:transparent;color:inherit;font:20px/1.8 'Intel One Mono','BIZ UDGothic',monospace;letter-spacing:0.01em;tab-size:4;scrollbar-color:#666 #202020}
textarea::selection{background:#555;color:#dfdfdf}
#state{position:fixed;right:18px;top:12px;font:12px 'Intel One Mono','BIZ UDGothic',monospace;color:#b0b0b0}
#state:empty,[hidden]{display:none!important}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0008;padding:24px}
#picker-group{position:relative;width:min(560px,100%)}
#picker{position:relative;box-sizing:border-box;width:100%;max-height:calc(100dvh - 180px);background:#292929;border-radius:8px;padding:52px 16px 16px;box-shadow:0 16px 64px #0006}
#archive-heading{position:absolute;top:18px;left:32px;font-size:12px;color:#aaa}
#archive-toast{position:absolute;top:calc(100% + 12px);left:0;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 20px;background:#303030;border-radius:4px;font-size:14px}
#undo-archive{border:0;border-radius:4px;padding:8px 10px;min-height:40px;background:#4b4b4b}
#undo-archive:hover{background:#585858}
button{font:inherit;color:inherit;cursor:pointer}
#close{position:absolute;right:14px;top:10px;width:32px;height:32px;border:0;background:transparent;font-size:24px;color:#aaa}
#close:hover{color:#dfdfdf}
#memo-list{overflow:auto;max-height:calc(100dvh - 260px);outline:none;scrollbar-color:#666 #292929}
.memo{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-radius:4px;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;line-height:1.5}
.memo[aria-selected="true"]{background:#414141}
.memo:hover{background:#373737}
.title-edit{box-sizing:border-box;background:#414141}
.title-edit input{box-sizing:border-box;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;line-height:inherit;outline-offset:4px}
.title-error{margin:8px 0 0;font-size:12px;white-space:normal;color:#dfb8a5}
.memo:focus-visible,#close:focus-visible{outline:1px solid #aaa;outline-offset:-2px}
@media(max-width:600px){textarea{padding:36px 24px}}
</style>
<span id="state" role="status" aria-live="polite"></span>
<div class="editor-shell"><textarea id="editor" aria-label="本文" spellcheck="false" disabled></textarea><button id="scroll-thumb" type="button" aria-label="本文のスクロール位置をドラッグ" aria-controls="editor"></button></div>
<div id="overlay" hidden>
 <div id="picker-group" role="dialog" aria-modal="true" aria-label="メモを切り替える">
  <section id="picker">
    <span id="archive-heading" hidden>アーカイブ · 選ぶと戻す</span>
    <button id="close" type="button" aria-label="閉じる">×</button>
    <div id="memo-list" role="listbox" aria-label="メモ" tabindex="0"></div>
  </section>
  <div id="archive-toast" role="status" hidden><span>アーカイブしました</span><button id="undo-archive" type="button">取り消す</button></div>
 </div>
</div>
<script type="module">
const token=location.hash.slice(1)||sessionStorage.getItem('token');
if(token){sessionStorage.setItem('token',token);history.replaceState(null,'',location.pathname)}
const editor=document.querySelector('#editor'),state=document.querySelector('#state');
const scrollbar=(()=>{
  const thumb=document.querySelector('#scroll-thumb');
  let timer,drag=null,hover=false;
  function geometry(){
    const track=Math.max(0,editor.clientHeight-8);
    const height=Math.min(track,Math.max(44,track*editor.clientHeight/Math.max(1,editor.scrollHeight)));
    return {height,travel:track-height,max:editor.scrollHeight-editor.clientHeight};
  }
  function update(){
    const g=geometry();thumb.style.height=g.height+'px';
    thumb.style.top=(4+(g.max>0?editor.scrollTop/g.max*g.travel:0))+'px';
    if(g.max<=0)thumb.classList.remove('visible');
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(!drag&&!hover&&document.activeElement!==thumb)thumb.classList.remove('visible')},1500)}
  editor.addEventListener('scroll',()=>{update();if(geometry().max>0)thumb.classList.add('visible');schedule()});
  editor.addEventListener('input',update);
  thumb.addEventListener('pointerenter',()=>{hover=true;clearTimeout(timer)});
  thumb.addEventListener('pointerleave',()=>{hover=false;schedule()});
  thumb.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();drag={y:event.clientY,top:editor.scrollTop};thumb.setPointerCapture(event.pointerId);clearTimeout(timer)});
  thumb.addEventListener('pointermove',event=>{if(!drag)return;const g=geometry();if(g.travel>0)editor.scrollTop=drag.top+(event.clientY-drag.y)*g.max/g.travel});
  function release(){drag=null;schedule()}
  for(const name of ['pointerup','pointercancel','lostpointercapture'])thumb.addEventListener(name,release);
  thumb.addEventListener('blur',schedule);
  thumb.addEventListener('keydown',event=>{
    const steps={ArrowDown:36,ArrowUp:-36,PageDown:editor.clientHeight,PageUp:-editor.clientHeight};
    if(event.key in steps){event.preventDefault();editor.scrollTop+=steps[event.key]}
    else if(event.key==='Home'||event.key==='End'){event.preventDefault();editor.scrollTop=event.key==='Home'?0:editor.scrollHeight}
  });
  new ResizeObserver(update).observe(editor);
  return {update};
})();
const overlay=document.querySelector('#overlay'),list=document.querySelector('#memo-list');
const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
const sessionId=crypto.randomUUID();
let memoId='legacy',revision,lease,pending=null,unconfirmed=null,saveTask=null;
let failed=false,ready=false,busy=false,leaseLost=false,notice='';
let choices=[],selected=0,position=null,renaming=null;
let catalog=null,archiveView=false,archiveOperation=null,archiveSending=false,undoId=null,toastTimer,toastHovered=false;
const archiveToast=document.querySelector('#archive-toast'),undoButton=document.querySelector('#undo-archive');
const journalKey=()=>`unsaved:${sessionId}:${memoId}`;
function status(message=''){state.textContent=message||notice}
function journal(){
  try{localStorage.setItem(journalKey(),JSON.stringify({memoId,text:editor.value,revision}))}
  catch{status('復元用コピーを保存できません · 閉じずに接続を確認してください')}
}
async function api(route,method='GET',body){
  const response=await fetch('/api/'+route,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(5000)});
  if(!response.ok){const error=Error(await response.text());error.status=response.status;throw error}
  return response.json();
}
function save(){
  if(saveTask)return saveTask;
  if(leaseLost)return Promise.resolve(false);
  saveTask=(async()=>{
    while(pending!==null||unconfirmed){
      if(!unconfirmed){unconfirmed={id:memoId,body:{text:pending,revision,lease}};pending=null}
      try{
        const result=await api('memos/'+unconfirmed.id,'PUT',unconfirmed.body);
        revision=result.revision;unconfirmed=null;failed=false;
        if(pending===null){try{localStorage.removeItem(journalKey())}catch{}}
        else journal();
        status();
      }catch(error){
        failed=true;pending=editor.value;journal();
        status('保存できません · 本文はこの画面に残っています');return false;
      }
    }
    return true;
  })().finally(()=>{saveTask=null});
  return saveTask;
}
editor.addEventListener('input',()=>{pending=editor.value;journal();failed=false;void save()});
window.addEventListener('beforeunload',event=>{
  if(pending!==null||unconfirmed||saveTask||failed||busy){event.preventDefault();event.returnValue=''}
});
setInterval(()=>{if(failed&&!busy&&!leaseLost)void save()},2000);
function rememberPosition(){position={start:editor.selectionStart,end:editor.selectionEnd,scroll:editor.scrollTop}}
function closePicker(){
  if(busy)return;
  if(renaming)cancelRename();
  overlay.hidden=true;editor.focus();
  if(position){editor.setSelectionRange(position.start,position.end);editor.scrollTop=position.scroll}
}
function renderList(){
  list.replaceChildren();
  choices.forEach((memo,index)=>{
    const row=document.createElement('button');row.type='button';row.className='memo';
    row.id='memo-option-'+index;row.tabIndex=-1;row.setAttribute('role','option');
    row.setAttribute('aria-selected',String(index===selected));row.textContent=memo.title;
    row.addEventListener('pointerenter',()=>{if(!busy&&!renaming){selected=index;highlight()}});
    row.addEventListener('click',()=>{if(!renaming)void selectChoice(memo)});list.append(row);
  });
  highlight();
}
function cancelRename(){
  if(busy||!renaming)return;
  renaming=null;renderList();list.focus();
}
function beginRename(){
  if(busy||leaseLost||renaming)return;
  const memo=choices[selected];if(!memo||memo.create||memo.view!==undefined||archiveView)return;
  const row=document.createElement('div');row.className='memo title-edit';
  row.id='memo-option-'+selected;row.setAttribute('role','option');row.setAttribute('aria-selected','true');
  const input=document.createElement('input');input.id='title-input';input.type='text';input.maxLength=200;
  input.value=memo.title;input.setAttribute('aria-label','メモのタイトル');input.autocomplete='off';
  const error=document.createElement('p');error.className='title-error';error.setAttribute('role','alert');
  row.append(input,error);list.children[selected].replaceWith(row);
  renaming={memo,input,error};input.focus();input.select();
}
async function confirmRename(){
  if(busy||!renaming||leaseLost)return;
  const edit=renaming,title=edit.input.value.trim();
  if(!title||title.length>200||/[\x00-\x1f\x7f]/.test(title)){
    edit.error.textContent='タイトルを1〜200文字で入力してください';return;
  }
  busy=true;edit.input.readOnly=true;edit.error.textContent='';
  try{
    await api('memos/'+edit.memo.id+'/title','PUT',{lease,title});
    edit.memo.title=title;renaming=null;renderList();list.focus();
  }catch{edit.error.textContent='変更を保存できません · Enterで再試行、Escで取消'}
  finally{busy=false;edit.input.readOnly=false;if(renaming)edit.input.focus()}
}
function highlight(){
  for(let i=0;i<list.children.length;i++)list.children[i].setAttribute('aria-selected',String(i===selected));
  const row=list.children[selected];
  if(row){list.setAttribute('aria-activedescendant',row.id);row.scrollIntoView({block:'nearest'})}
}
async function openPicker(){
  if(!ready||busy||leaseLost)return;
  rememberPosition();busy=true;
  try{
    catalog=await api('memos');archiveView=false;
    overlay.hidden=false;selected=0;fillChoices(memoId);list.focus();
  }catch{status('メモ一覧を開けません · 本文はこの画面に残っています')}
  finally{busy=false}
}
function fillChoices(preferredId){
  choices=archiveView
    ?[{id:null,title:'メモに戻る',view:false},...catalog.archivedMemos]
    :[{id:null,title:'新規メモ',create:true},...catalog.memos,...(catalog.archivedMemos.length?[{id:null,title:'アーカイブ',view:true}]:[])];
  const preferred=preferredId?choices.findIndex(m=>m.id===preferredId):-1;
  selected=preferred>=0?preferred:Math.min(selected,choices.length-1);
  document.querySelector('#archive-heading').hidden=!archiveView;renderList();
}
function selectChoice(memo){
  if(busy||leaseLost||!memo)return;
  if(memo.view!==undefined){archiveView=memo.view;selected=0;fillChoices();list.focus();return}
  if(archiveView)return changeArchive(memo.id,false);
  return switchMemo(memo.id,{create:!!memo.create});
}
function hideToast(){
  clearTimeout(toastTimer);undoId=null;archiveToast.hidden=true;toastHovered=false;
  if(document.activeElement===undoButton)list.focus();
}
function scheduleToast(){
  clearTimeout(toastTimer);
  if(undoId&&!toastHovered&&document.activeElement!==undoButton)toastTimer=setTimeout(hideToast,8000);
}
function showToast(id){undoId=id;archiveToast.hidden=false;scheduleToast()}
archiveToast.addEventListener('pointerenter',()=>{toastHovered=true;clearTimeout(toastTimer)});
archiveToast.addEventListener('pointerleave',()=>{toastHovered=false;scheduleToast()});
undoButton.addEventListener('focus',()=>clearTimeout(toastTimer));undoButton.addEventListener('blur',scheduleToast);
undoButton.addEventListener('click',()=>{if(undoId)void changeArchive(undoId,false)});
async function changeArchive(id,archived){
  if(!id||busy||leaseLost||renaming)return;
  busy=true;editor.readOnly=true;
  if(!await save()){busy=false;editor.readOnly=leaseLost;return}
  archiveOperation={id,archived};await runArchiveOperation();
}
async function runArchiveOperation(){
  if(!archiveOperation||archiveSending||leaseLost)return;
  archiveSending=true;const operation=archiveOperation;
  try{
    // Retry the same logical state after response loss; never guess that a mutation failed.
    const result=await api('memos/'+operation.id+'/archive','PUT',{lease,archived:operation.archived});
    catalog=result;
    if((result.current?.id??null)!==memoId){
      memoId=result.current?.id??null;revision=result.current?.revision;
      editor.value=result.current?.text??'';editor.disabled=!result.current;
      editor.scrollTop=0;editor.setSelectionRange(0,0);scrollbar.update();position=null;
    }
    archiveOperation=null;busy=false;editor.readOnly=leaseLost;
    if(!operation.archived)archiveView=false;
    fillChoices(operation.archived?undefined:operation.id);list.focus();status();
    if(operation.archived)showToast(operation.id);else hideToast();
  }catch(error){
    if(error.status>=400&&error.status<500){archiveOperation=null;busy=false;editor.readOnly=leaseLost;status('変更できません · メモは削除していません')}
    else status('状態を確認しています · 接続が戻ると自動で再試行します');
  }finally{archiveSending=false}
}
setInterval(()=>{if(archiveOperation)void runArchiveOperation()},2000);
async function switchMemo(id,{create=false}={}){
  if(!ready||busy||leaseLost)return;
  if(!create&&id===memoId){closePicker();return}
  busy=true;editor.readOnly=true;
  try{
    if(!await save())return;
    // Load the target completely before recording selection or replacing the textarea.
    const target=create?await api('memos','POST',{lease}):await api('memos/'+id);
    await api('active','PUT',{lease,id:target.id});
    memoId=target.id;revision=target.revision;editor.value=target.text;editor.disabled=false;scrollbar.update();
    pending=null;unconfirmed=null;failed=false;position=null;
    overlay.hidden=true;editor.scrollTop=0;editor.setSelectionRange(0,0);status();
  }catch{
    status(create?'新しいメモを開けません · 作成済みなら Ctrl+P の一覧から開けます':'切り替えられません · 元の本文を保持しています');
  }finally{
    busy=false;editor.readOnly=leaseLost;
    if(overlay.hidden)editor.focus();else list.focus();
  }
}
document.querySelector('#close').addEventListener('click',closePicker);
overlay.addEventListener('click',event=>{if(event.target===overlay)closePicker()});
document.addEventListener('keydown',event=>{
  if(event.isComposing||event.keyCode===229)return;
  if(renaming){
    if(event.key==='Enter'&&document.activeElement===document.querySelector('#close'))return;
    if(event.key==='Enter'){event.preventDefault();void confirmRename()}
    else if(event.key==='Escape'){event.preventDefault();cancelRename()}
    else if(event.key==='Tab'){
      event.preventDefault();(document.activeElement===renaming.input?document.querySelector('#close'):renaming.input).focus();
    }else if(event.ctrlKey&&['p','n','m'].includes(event.key.toLowerCase()))event.preventDefault();
    return;
  }
  if(!overlay.hidden&&event.ctrlKey&&!event.altKey&&!event.shiftKey&&event.key.toLowerCase()==='m'){
    event.preventDefault();beginRename();return;
  }
  if(event.ctrlKey&&!event.altKey&&!event.shiftKey&&event.key.toLowerCase()==='p'){
    event.preventDefault();if(overlay.hidden)void openPicker();else closePicker();return;
  }
  if(event.ctrlKey&&!event.altKey&&!event.shiftKey&&event.key.toLowerCase()==='n'){
    event.preventDefault();void switchMemo(null,{create:true});return;
  }
  if(overlay.hidden)return;
  if(event.key==='Delete'&&!event.ctrlKey&&!event.altKey&&!event.shiftKey){
    event.preventDefault();const memo=choices[selected];
    if(event.repeat||document.activeElement===undoButton||document.activeElement===document.querySelector('#close'))return;
    if(!archiveView&&memo?.id)void changeArchive(memo.id,true);return;
  }
  if(event.key==='Escape'){event.preventDefault();closePicker()}
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){
    event.preventDefault();if(busy)return;
    selected=Math.max(0,Math.min(choices.length-1,selected+(event.key==='ArrowDown'?1:-1)));highlight();list.focus();
  }
  if(event.key==='Enter'&&document.activeElement!==document.querySelector('#close')&&document.activeElement!==undoButton){
    event.preventDefault();if(choices[selected])void selectChoice(choices[selected]);
  }
  if(event.key==='Tab'){
    event.preventDefault();const targets=[list,document.querySelector('#close'),...(!archiveToast.hidden?[undoButton]:[])];
    const index=targets.indexOf(document.activeElement);targets[(index+(event.shiftKey?-1:1)+targets.length)%targets.length].focus();
  }
});
async function recoverJournals(){
  const entries=[];
  for(const key of Object.keys(localStorage).filter(key=>key.startsWith('unsaved:'))){
    const raw=localStorage.getItem(key);
    try{const saved=JSON.parse(raw);if(typeof saved.text!=='string')throw Error();entries.push({key,raw,saved,id:saved.memoId||'legacy'})}
    catch{notice='読み取れない復元用コピーあり · この画面の保存領域に保持しています'}
  }
  for(const entry of entries){
    const {key,raw,saved,id}=entry;
    // Always retain a separate disk copy before attempting an automatic restoration.
    await api('recovery','POST',{text:saved.text});
    let restored=false;
    try{
      const current=await api('memos/'+encodeURIComponent(id));
      if(saved.text===current.text)restored=true;
      else if(entries.filter(other=>other.id===id).length===1&&saved.revision===current.revision){
        await api('memos/'+id,'PUT',{lease,text:saved.text,revision:current.revision});restored=true;
      }
    }catch{}
    if(!restored)notice='未保存の別稿あり · data の recovery ファイルに保持しています';
    if(localStorage.getItem(key)===raw)localStorage.removeItem(key);
  }
}
try{
  const service=await api('status');
  if(service.protocol!==4)throw Object.assign(Error(),{outdated:true});
  lease=(await api('lease','POST')).lease;
  setInterval(async()=>{
    if(leaseLost)return;
    try{await api('lease','PUT',{lease});if(state.textContent.startsWith('接続待ち'))status()}
    catch(error){
      if(error.status===409){leaseLost=true;editor.readOnly=true;status('別の画面またはサーバーが開かれました · 閉じて開き直してください')}
      else status('接続待ち · 未保存の本文は復元用に保持します');
    }
  },3000);
  await recoverJournals();
  catalog=await api('memos');const current=catalog.lastId?await api('memos/'+catalog.lastId):null;
  memoId=current?.id??null;revision=current?.revision;editor.value=current?.text??'';scrollbar.update();
  editor.disabled=!current;ready=true;editor.focus();status();
}catch(error){status(error.outdated?'更新のため、すべての minimal-editor を閉じて開き直してください':'開けません · すでに開いている画面がないか確認してください')}
window.addEventListener('pagehide',()=>{
  if(lease)fetch('/api/lease',{method:'DELETE',headers,body:JSON.stringify({lease}),keepalive:true}).catch(()=>{});
});
</script>
</html>
