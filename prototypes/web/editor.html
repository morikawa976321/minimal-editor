<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>minimal-editor</title>
<style>
:root{color-scheme:dark;background:#202020;color:#dfdfdf;font-family:'Intel One Mono','BIZ UDGothic',monospace}
body{margin:0}
textarea{display:block;box-sizing:border-box;width:min(100%,1100px);height:100dvh;margin:auto;padding:60px 48px 48px;border:0;outline:0;resize:none;background:transparent;color:inherit;font:20px/1.9 'Intel One Mono','BIZ UDGothic',monospace;letter-spacing:0;tab-size:4;scrollbar-color:#666 #202020}
textarea::selection{background:#555;color:#dfdfdf}
#state{position:fixed;right:18px;top:12px;font:12px 'Intel One Mono','BIZ UDGothic',monospace;color:#b0b0b0}
#state:empty,[hidden]{display:none!important}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0008;padding:24px}
#picker{position:relative;box-sizing:border-box;width:min(560px,100%);max-height:75dvh;background:#292929;border-radius:8px;padding:52px 16px 16px;box-shadow:0 16px 64px #0006}
button{font:inherit;color:inherit;cursor:pointer}
#close{position:absolute;right:14px;top:10px;width:32px;height:32px;border:0;background:transparent;font-size:24px;color:#aaa}
#close:hover{color:#dfdfdf}
#memo-list{overflow:auto;max-height:calc(75dvh - 90px);outline:none;scrollbar-color:#666 #292929}
.memo{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-radius:4px;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;line-height:1.5}
.memo[aria-selected="true"]{background:#414141}
.memo:hover{background:#373737}
.memo:focus-visible,#close:focus-visible{outline:1px solid #aaa;outline-offset:-2px}
@media(max-width:600px){textarea{padding:36px 24px}}
</style>
<span id="state" role="status" aria-live="polite"></span>
<textarea id="editor" aria-label="本文" spellcheck="false" disabled></textarea>
<div id="overlay" hidden>
  <section id="picker" role="dialog" aria-modal="true" aria-label="メモを切り替える">
    <button id="close" type="button" aria-label="閉じる">×</button>
    <div id="memo-list" role="listbox" aria-label="メモ" tabindex="0"></div>
  </section>
</div>
<script type="module">
const token=location.hash.slice(1)||sessionStorage.getItem('token');
if(token){sessionStorage.setItem('token',token);history.replaceState(null,'',location.pathname)}
const editor=document.querySelector('#editor'),state=document.querySelector('#state');
const overlay=document.querySelector('#overlay'),list=document.querySelector('#memo-list');
const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
const sessionId=crypto.randomUUID();
let memoId='legacy',revision,lease,pending=null,unconfirmed=null,saveTask=null;
let failed=false,ready=false,busy=false,leaseLost=false,notice='';
let choices=[],selected=0,position=null;
const journalKey=()=>`unsaved:${sessionId}:${memoId}`;
function status(message=''){state.textContent=message||notice}
function journal(){
  try{localStorage.setItem(journalKey(),JSON.stringify({memoId,text:editor.value,revision}))}
  catch{status('復元用コピーを保存できません · 閉じずに接続を確認してください')}
}
async function api(route,method='GET',body){
  const response=await fetch('/api/'+route,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(5000)});
  if(!response.ok){const error=Error(await response.text());error.status=response.status;throw error}
  return response.json();
}
function save(){
  if(saveTask)return saveTask;
  if(leaseLost)return Promise.resolve(false);
  saveTask=(async()=>{
    while(pending!==null||unconfirmed){
      if(!unconfirmed){unconfirmed={id:memoId,body:{text:pending,revision,lease}};pending=null}
      try{
        const result=await api('memos/'+unconfirmed.id,'PUT',unconfirmed.body);
        revision=result.revision;unconfirmed=null;failed=false;
        if(pending===null){try{localStorage.removeItem(journalKey())}catch{}}
        else journal();
        status();
      }catch(error){
        failed=true;pending=editor.value;journal();
        status('保存できません · 本文はこの画面に残っています');return false;
      }
    }
    return true;
  })().finally(()=>{saveTask=null});
  return saveTask;
}
editor.addEventListener('input',()=>{pending=editor.value;journal();failed=false;void save()});
window.addEventListener('beforeunload',event=>{
  if(pending!==null||unconfirmed||saveTask||failed||busy){event.preventDefault();event.returnValue=''}
});
setInterval(()=>{if(failed&&!busy&&!leaseLost)void save()},2000);
function rememberPosition(){position={start:editor.selectionStart,end:editor.selectionEnd,scroll:editor.scrollTop}}
function closePicker(){
  if(busy)return;
  overlay.hidden=true;editor.focus();
  if(position){editor.setSelectionRange(position.start,position.end);editor.scrollTop=position.scroll}
}
function renderList(){
  list.replaceChildren();
  choices.forEach((memo,index)=>{
    const row=document.createElement('button');row.type='button';row.className='memo';
    row.id='memo-option-'+index;row.tabIndex=-1;row.setAttribute('role','option');
    row.setAttribute('aria-selected',String(index===selected));row.textContent=memo.title;
    row.addEventListener('click',()=>void switchMemo(memo.id));list.append(row);
  });
  highlight();
}
function highlight(){
  for(let i=0;i<list.children.length;i++)list.children[i].setAttribute('aria-selected',String(i===selected));
  const row=list.children[selected];
  if(row){list.setAttribute('aria-activedescendant',row.id);row.scrollIntoView({block:'nearest'})}
}
async function openPicker(){
  if(!ready||busy||leaseLost)return;
  rememberPosition();busy=true;
  try{
    const result=await api('memos');choices=result.memos;
    selected=Math.max(0,choices.findIndex(memo=>memo.id===memoId));
    overlay.hidden=false;renderList();list.focus();
  }catch{status('メモ一覧を開けません · 本文はこの画面に残っています')}
  finally{busy=false}
}
async function switchMemo(id,{create=false}={}){
  if(!ready||busy||leaseLost)return;
  if(!create&&id===memoId){closePicker();return}
  busy=true;editor.readOnly=true;
  try{
    if(!await save())return;
    // Load the target completely before recording selection or replacing the textarea.
    const target=create?await api('memos','POST',{lease}):await api('memos/'+id);
    await api('active','PUT',{lease,id:target.id});
    memoId=target.id;revision=target.revision;editor.value=target.text;
    pending=null;unconfirmed=null;failed=false;position=null;
    overlay.hidden=true;editor.scrollTop=0;editor.setSelectionRange(0,0);status();
  }catch{
    status(create?'新しいメモを開けません · 作成済みなら Ctrl+P の一覧から開けます':'切り替えられません · 元の本文を保持しています');
  }finally{
    busy=false;editor.readOnly=leaseLost;
    if(overlay.hidden)editor.focus();else list.focus();
  }
}
document.querySelector('#close').addEventListener('click',closePicker);
overlay.addEventListener('click',event=>{if(event.target===overlay)closePicker()});
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.ctrlKey&&!event.altKey&&!event.shiftKey&&event.key.toLowerCase()==='p'){
    event.preventDefault();if(overlay.hidden)void openPicker();else closePicker();return;
  }
  if(event.ctrlKey&&!event.altKey&&!event.shiftKey&&event.key.toLowerCase()==='n'){
    event.preventDefault();void switchMemo(null,{create:true});return;
  }
  if(overlay.hidden)return;
  if(event.key==='Escape'){event.preventDefault();closePicker()}
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){
    event.preventDefault();if(busy)return;
    selected=Math.max(0,Math.min(choices.length-1,selected+(event.key==='ArrowDown'?1:-1)));highlight();list.focus();
  }
  if(event.key==='Enter'&&document.activeElement!==document.querySelector('#close')){
    event.preventDefault();if(choices[selected])void switchMemo(choices[selected].id);
  }
  if(event.key==='Tab'){
    event.preventDefault();(document.activeElement===list?document.querySelector('#close'):list).focus();
  }
});
async function recoverJournals(){
  const entries=[];
  for(const key of Object.keys(localStorage).filter(key=>key.startsWith('unsaved:'))){
    const raw=localStorage.getItem(key);
    try{const saved=JSON.parse(raw);if(typeof saved.text!=='string')throw Error();entries.push({key,raw,saved,id:saved.memoId||'legacy'})}
    catch{notice='読み取れない復元用コピーあり · この画面の保存領域に保持しています'}
  }
  for(const entry of entries){
    const {key,raw,saved,id}=entry;
    // Always retain a separate disk copy before attempting an automatic restoration.
    await api('recovery','POST',{text:saved.text});
    let restored=false;
    try{
      const current=await api('memos/'+encodeURIComponent(id));
      if(saved.text===current.text)restored=true;
      else if(entries.filter(other=>other.id===id).length===1&&saved.revision===current.revision){
        await api('memos/'+id,'PUT',{lease,text:saved.text,revision:current.revision});restored=true;
      }
    }catch{}
    if(!restored)notice='未保存の別稿あり · data の recovery ファイルに保持しています';
    if(localStorage.getItem(key)===raw)localStorage.removeItem(key);
  }
}
try{
  const service=await api('status');
  if(service.protocol!==2)throw Object.assign(Error(),{outdated:true});
  lease=(await api('lease','POST')).lease;
  setInterval(async()=>{
    if(leaseLost)return;
    try{await api('lease','PUT',{lease});if(state.textContent.startsWith('接続待ち'))status()}
    catch(error){
      if(error.status===409){leaseLost=true;editor.readOnly=true;status('別の画面またはサーバーが開かれました · 閉じて開き直してください')}
      else status('接続待ち · 未保存の本文は復元用に保持します');
    }
  },3000);
  await recoverJournals();
  const catalog=await api('memos'),current=await api('memos/'+catalog.lastId);
  memoId=current.id;revision=current.revision;editor.value=current.text;
  editor.disabled=false;ready=true;editor.focus();status();
}catch(error){status(error.outdated?'更新のため、すべての minimal-editor を閉じて開き直してください':'開けません · すでに開いている画面がないか確認してください')}
window.addEventListener('pagehide',()=>{
  if(lease)fetch('/api/lease',{method:'DELETE',headers,body:JSON.stringify({lease}),keepalive:true}).catch(()=>{});
});
</script>
</html>
