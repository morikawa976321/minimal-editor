<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>minimal editor · 比較</title>
<style>
:root{color-scheme:dark;font:16px/1.7 'BIZ UDGothic','Noto Sans JP',sans-serif;background:#181a1b;color:#dededb}body{max-width:960px;margin:32px auto;padding:0 30px}h1{font-size:22px;font-weight:400;margin-bottom:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}h2{font-size:20px;font-weight:400}button{font:inherit;color:inherit;background:#25282a;border:0;border-radius:3px;padding:10px 16px;cursor:pointer;margin:6px 6px 6px 0}button:hover{background:#34383b}button[aria-pressed=true]{background:#d1d6d0;color:#17191a}.reason{margin-top:12px}.reason button{font-size:13px;padding:7px 9px}.choices{margin:20px 0 12px}textarea{box-sizing:border-box;width:100%;height:150px;background:#1e2022;color:#c3c8c3;border:0;padding:16px;font:14px/1.8 'BIZ UDGothic',monospace;resize:vertical}details{margin:12px 0;font-size:13px;color:#b6b9b5}summary{cursor:pointer}#status{min-height:24px;color:#e6b190;font-size:13px}@media(max-width:650px){main{grid-template-columns:1fr;gap:20px}body{margin-top:30px}}
</style>
<h1>minimal editor</h1><main>
<section data-kind="web"><h2>A · Edge</h2><button class="launch">開く</button><div><button class="best">一番いい</button></div><div class="reason">致命的な問題<div></div></div></section>
<section data-kind="native"><h2>B · Windows</h2><button class="launch">開く</button><div><button class="best">一番いい</button></div><div class="reason">致命的な問題<div></div></div></section>
<section data-kind="tk"><h2>C · Python</h2><button class="launch">開く</button><div><button class="best">一番いい</button></div><div class="reason">致命的な問題<div></div></div></section>
</main>
<div class="choices"><button data-choice="AとBはどちらも問題ない">A と B · どちらも問題ない</button><button data-choice="AとCはどちらも問題ない">A と C · どちらも問題ない</button><button data-choice="BとCはどちらも問題ない">B と C · どちらも問題ない</button><button data-choice="全部問題ない">全部問題ない</button><button data-choice="全部合わない">全部合わない</button><button data-choice="保留・寝かせる">保留</button></div>
<details><summary>判断カード</summary><p>使い続けたいのはどれ？</p><p>暫定推奨は A。既存の Edge と標準の入力欄を使え、日本語の長文を扱いやすい構造です。B は Windows 標準の入力欄、C は Python の Text 欄。体感を優先し、まだどれも棄却していません。</p><p>選んだ方式を次の実用版の基礎にします。文字サイズ・行幅・保存先を変えたいなら、返すテキストに一言足せます。</p></details>
<div id="status" role="status"></div><textarea id="result" aria-label="選択結果" readonly></textarea><button id="copy">結果をコピー</button>
<script>
const base='http://127.0.0.1:__PORT__',token='__TOKEN__';
let saved;try{saved=JSON.parse(localStorage.getItem('minimal-editor-comparison')||'null')}catch{}
const selection=saved||{choice:'未選択',problems:{web:[],native:[],tk:[]}};
const names={web:'A · Edge',native:'B · Windows',tk:'C · Python'};
function render(){document.querySelector('#result').value=['minimal-editor V0 比較','選択: '+selection.choice,...Object.entries(selection.problems).map(([k,v])=>names[k]+': '+(v.length?'致命的な問題 — '+v.join('／'):'問題の選択なし'))].join('\n');document.querySelectorAll('.best').forEach(b=>b.setAttribute('aria-pressed',selection.choice===names[b.closest('section').dataset.kind]));document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.choice===selection.choice));try{localStorage.setItem('minimal-editor-comparison',JSON.stringify(selection))}catch{}}
for(const section of document.querySelectorAll('section')){const kind=section.dataset.kind;section.querySelector('.launch').onclick=async()=>{try{const r=await fetch(base+'/api/launch',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({kind})});if(!r.ok)throw Error();document.querySelector('#status').textContent=''}catch{document.querySelector('#status').textContent='起動できません · 「比較を開く.cmd」を開いてください'}};section.querySelector('.best').onclick=()=>{selection.choice=names[kind];render()};for(const reason of ['入力','見た目','速さ','保存','起動']){const b=document.createElement('button');b.textContent=reason;b.setAttribute('aria-pressed',selection.problems[kind].includes(reason));b.onclick=()=>{const list=selection.problems[kind],i=list.indexOf(reason);i<0?list.push(reason):list.splice(i,1);b.setAttribute('aria-pressed',list.includes(reason));render()};section.querySelector('.reason div').append(b)}}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selection.choice=b.dataset.choice;render()});
document.querySelector('#copy').onclick=async()=>{const area=document.querySelector('#result');try{await navigator.clipboard.writeText(area.value);document.querySelector('#status').textContent='コピーしました'}catch{area.select();const ok=document.execCommand('copy');document.querySelector('#status').textContent=ok?'コピーしました':'結果欄を選択しました'}};render();
</script></html>
