<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書きかけ · アイコン展開</title><style>

ght="2.5" rx="0.4"/><rect x="16" y="19.5" width="4" height="5.5" rx="0.3"/></g></svg></div><div class="sizes"><span>16</span><svg width="16" height="16" viewBox="0 0 32 32" aria-label="ブロック"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="8" width="20" height="2.5" rx="0.4"/><rect x="6" y="14.5" width="16" height="2.5" rx="0.4"/><rect x="6" y="21" width="7" height="2.5" rx="0.4"/><rect x="16" y="19.5" width="4" height="5.5" rx="0.3"/></g></svg><span>24</span><svg width="24" height="24" viewBox="0 0 32 32" aria-label="ブロック"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="8" width="20" height="2.5" rx="0.4"/><rect x="6" y="14.5" width="16" height="2.5" rx="0.4"/><rect x="6" y="21" width="7" height="2.5" rx="0.4"/><rect x="16" y="19.5" width="4" height="5.5" rx="0.3"/></g></svg><span>32</span><svg width="32" height="32" viewBox="0 0 32 32" aria-label="ブロック"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="8" width="20" height="2.5" rx="0.4"/><rect x="6" y="14.5" width="16" height="2.5" rx="0.4"/><rect x="6" y="21" width="7" height="2.5" rx="0.4"/><rect x="16" y="19.5" width="4" height="5.5" rx="0.3"/></g></svg></div><h2>2　ブロック <small>· 推奨</small></h2><p>書きかけの末尾に、四角いカーソル。</p><button class="pick" data-choice="2 ブロック（G）">この形が好き</button></article><article><div class="large"><svg width="128" height="128" viewBox="0 0 32 32" aria-label="二行"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="11" width="20" height="3" rx="0.4"/><rect x="6" y="19" width="10" height="3" rx="0.4"/><rect x="19" y="17.5" width="2" height="6" rx="0.3"/></g></svg></div><div class="sizes"><span>16</span><svg width="16" height="16" viewBox="0 0 32 32" aria-label="二行"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="11" width="20" height="3" rx="0.4"/><rect x="6" y="19" width="10" height="3" rx="0.4"/><rect x="19" y="17.5" width="2" height="6" rx="0.3"/></g></svg><span>24</span><svg width="24" height="24" viewBox="0 0 32 32" aria-label="二行"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="11" width="20" height="3" rx="0.4"/><rect x="6" y="19" width="10" height="3" rx="0.4"/><rect x="19" y="17.5" width="2" height="6" rx="0.3"/></g></svg><span>32</span><svg width="32" height="32" viewBox="0 0 32 32" aria-label="二行"><rect width="32" height="32" rx="6" fill="#282828"/><g fill="#e7e5df"><rect x="6" y="11" width="20" height="3" rx="0.4"/><rect x="6" y="19" width="10" height="3" rx="0.4"/><rect x="19" y="17.5" width="2" height="6" rx="0.3"/></g></svg></div><h2>3　二行</h2><p>行を二本に絞って、余白を広く。</p><button class="pick" data-choice="3 二行（C）">この形が好き</button></article></div><div class="other"><button data-choice="どれも問題ない（推奨の2）">どれも問題ない</button><button data-choice="さらに別の形を見たい">さらに別の形</button></div><textarea id="result" readonly aria-label="返信するテキスト" placeholder="選んだ結果がここに出ます"></textarea><footer>拡大図と16 / 24 / 32 CSS px。色は共通です。</footer><details><summary>判断のメモ</summary><p>決めること：この方向で好みに近い形はどれか。推奨は2：末尾の四角が小さい表示でも目に入りやすいと評価。1は気に入った原案を維持。2は少し端末らしい印象。3は要素を減らして余白を広く。採用後、アプリと起動用アイコンへ反映。調整したい箇所があれば返信テキストに追記。</p></details></main><script>document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#result').value='minimal-editor 書きかけアイコン'+String.fromCharCode(10)+'選択: '+button.dataset.choice}));document.querySelector('#result').addEventListener('click',event=>event.target.select());</script></html>
