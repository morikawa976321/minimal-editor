<div id="me-memo-preview" aria-label="本文とメモ切替のプレビュー">
  <textarea class="me-writing" aria-label="サンプル本文。CtrlとPでメモを切り替え" spellcheck="false"></textarea>
  <div class="me-overlay" hidden>
    <div class="me-modal" role="dialog" aria-modal="true" aria-label="メモを切り替え">
      <button class="me-close cursor-interaction" type="button" aria-label="メモ一覧を閉じる">×</button>
      <ul class="me-list" aria-label="作成日の新しい順のメモ"></ul>
    </div>
  </div>
</div>
<style>
#me-memo-preview{position:relative;height:560px;background:#202020;color:#dfdfdf;color-scheme:dark;font:400 16px/1.6 'Intel One Mono','BIZ UDGothic',monospace}
#me-memo-preview *{box-sizing:border-box}
#me-memo-preview [hidden]{display:none!important}
#me-memo-preview .me-writing{display:block;resize:none;width:100%;max-width:1100px;height:100%;margin:auto;padding:60px 48px 48px;background:transparent;color:inherit;border:0;font:400 20px/1.9 'Intel One Mono','BIZ UDGothic',monospace;scrollbar-color:#666 #202020}
#me-memo-preview .me-writing::selection{background:#555;color:#dfdfdf}
#me-memo-preview .me-overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:24px;background:#202020b8}
#me-memo-preview .me-modal{position:relative;width:520px;max-width:100%;max-height:100%;display:flex;flex-direction:column;padding:52px 16px 20px;background:#292929;border-radius:6px}
#me-memo-preview button{font:inherit;color:#dfdfdf;border:0;background:transparent;border-radius:4px}
#me-memo-preview .me-close{position:absolute;right:10px;top:6px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;font-size:24px;color:#aaa}
#me-memo-preview .me-close:hover{background:#363636;color:#dfdfdf}
#me-memo-preview .me-list{list-style:none;margin:0;padding:2px;overflow:auto;scrollbar-color:#666 #292929}
#me-memo-preview .me-list li+li{margin-top:4px}
#me-memo-preview .me-row{display:block;width:100%;padding:14px 16px;text-align:left;overflow-wrap:anywhere;min-height:48px}
#me-memo-preview .me-row:hover{background:#333}
#me-memo-preview .me-row[aria-pressed="true"]{background:#424242}
@media(max-width:520px){#me-memo-preview{height:580px}#me-memo-preview .me-writing{padding:36px 24px;font-size:18px}#me-memo-preview .me-overlay{padding:16px}#me-memo-preview .me-modal{padding-left:10px;padding-right:10px}}
</style>
<script>
(()=>{
 const root=document.getElementById('me-memo-preview');
 const editor=root.querySelector('.me-writing'),overlay=root.querySelector('.me-overlay'),list=root.querySelector('.me-list'),closeButton=root.querySelector('.me-close');
 // Creation dates order the examples, but are never rendered. All edits stay
 // in this preview's memory; no real files or editor APIs are accessed.
 const memos=[
  {id:'walk',created:20261014,name:'散歩のあと',text:'散歩から戻って、窓を開けた。\n\n歩いている間にはまとまらなかったことを、少しずつ書いてみる。\n答えを急がず、いま考えているところから。'},
  {id:'tools',created:20261016,name:'道具について',text:'毎日使う道具について。\n\n使っているあいだ、その存在を意識しなくてよいものが好きだ。'},
  {id:'idea',created:20261015,name:'まだ名前のない考え',text:'まだ形になっていないこと。\n\n思いついた順に置いておく。'},
  {id:'read',created:20261012,name:'読み返すためのメモ',text:'後でもう一度考えたいことを、ここに残しておく。'}
 ].sort((a,b)=>b.created-a.created);
 let current='walk',selected=0;
 const views=new Map();
 const controls={open:false};
 const currentMemo=()=>memos.find(m=>m.id===current);
 function rememberView(){views.set(current,{start:editor.selectionStart,end:editor.selectionEnd,direction:editor.selectionDirection,scroll:editor.scrollTop})}
 function restoreView(){editor.focus({preventScroll:true});const v=views.get(current);if(v){editor.setSelectionRange(v.start,v.end,v.direction);editor.scrollTop=v.scroll}}
 function select(index,focus=true){selected=Math.max(0,Math.min(memos.length-1,index));const rows=[...list.querySelectorAll('button')];rows.forEach((row,i)=>row.setAttribute('aria-pressed',String(i===selected)));if(focus){rows[selected].focus({preventScroll:true});rows[selected].scrollIntoView({block:'nearest'})}}
 function close(){if(overlay.hidden)return;overlay.hidden=true;controls.open=false;editor.inert=false;restoreView()}
 function choose(index){const next=memos[index].id;if(next!==current){current=next;editor.value=currentMemo().text;if(!views.has(current))views.set(current,{start:0,end:0,direction:'none',scroll:0})}close()}
 function open(){if(!overlay.hidden)return;rememberView();overlay.hidden=false;controls.open=true;editor.inert=true;list.replaceChildren();memos.forEach((memo,i)=>{const item=document.createElement('li'),button=document.createElement('button');button.type='button';button.className='me-row cursor-interaction';button.textContent=memo.name;button.dataset.memoId=memo.id;button.addEventListener('focus',()=>select(i,false));button.addEventListener('click',()=>choose(i));item.append(button);list.append(item)});select(memos.findIndex(m=>m.id===current))}
 editor.value=currentMemo().text;
 editor.addEventListener('input',()=>{currentMemo().text=editor.value});
 closeButton.addEventListener('click',close);
 overlay.addEventListener('click',event=>{if(event.target===overlay)close()});
 root.addEventListener('keydown',event=>{
  if(event.isComposing||event.keyCode===229)return;
  if(event.ctrlKey&&!event.altKey&&event.key.toLowerCase()==='p'){event.preventDefault();open();return}
  if(overlay.hidden)return;
  if(event.key==='Escape'){event.preventDefault();event.stopPropagation();close();return}
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();select(selected+(event.key==='ArrowDown'?1:-1));return}
  if(event.key==='Enter'&&event.target!==closeButton){event.preventDefault();choose(selected);return}
  if(event.key==='Tab'){
   const buttons=[...overlay.querySelectorAll('button')],first=buttons[0],last=buttons[buttons.length-1];
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
 });
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>controls.open?open():close()});tweak.addToggle(controls,'open',{label:'モーダルを表示'})}
})();
</script>
